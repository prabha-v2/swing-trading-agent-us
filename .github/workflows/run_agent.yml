name: Swing Trading Agent

on:
  # Triggered by cron-job.org (POST .../actions/workflows/run_agent.yml/dispatches),
  # not GitHub's `schedule:`, which started runs 2-5 hours late. Mon-Fri, New York time
  # (so US daylight-saving changes are automatic):
  #   09:45, 11:45, 13:45  intraday scans      (IST ~7:15 PM, 9:15 PM, 11:15 PM during US DST)
  #   15:30                near-close scan     (IST ~1:00 AM) — main Momentum Dip entry scan
  #   16:15                after-close scan    (IST ~1:45 AM) — exits/SELL alerts at the close
  workflow_dispatch:   # also usable manually from the Actions tab

# Allow the workflow to push trade_log.csv back to the repo
permissions:
  contents: write

# Runs are triggered at exact times by an external scheduler (cron-job.org calling
# workflow_dispatch) because GitHub's own schedule starts runs 2-5 hours late.
# If one run overlaps the next, queue it rather than cancel the one in progress
# (a cancelled run loses its trade-log update).
concurrency:
  group: swing-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 115

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push works cleanly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading agent
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:           ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python swing_trading_agent_us.py

      # Commit trade_log.csv (and updated positions.csv if changed) back to repo
      - name: Commit trade log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_log.csv positions.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📊 Trade log $(date +'%Y-%m-%d %H:%M UTC')"
          # Pull first: the user edits positions.csv from GitHub, and a commit made while
          # this run was scanning would otherwise reject the push and lose this run's log.
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
